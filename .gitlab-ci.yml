stages:
  - deploy

.docker_buildx: &docker_buildx
  - docker context create fedDB-context
  - docker buildx create --name fedDBBuilder --use fedDB-context
  - docker buildx inspect --bootstrap

variables:
  DOCKER_TLS_CERTDIR: ""

deploy:docker:
  image: docker:24.0.5
  stage: deploy
  services:
    - name: docker:24.0.5-dind
      alias: docker
  before_script:
    - docker info
    - *docker_buildx
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker buildx build --platform linux/amd64,linux/arm64/v8 --provenance false -f Dockerfile -t $CI_REGISTRY/$CI_PROJECT_PATH/pipeline:latest --push .
  allow_failure: true