name: Container scan

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to scan
        type: string
        default: latest
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  # Weekly scan of the published image
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

env:
  IMAGE: ghcr.io/fedlearnnet/tool-build-pipeline/pipeline
  # Scheduled runs have no inputs and scan latest
  TAG: ${{ inputs.tag || 'latest' }}

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan pipeline:${{ env.TAG }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true

      # Findings appear under Security → Code scanning
      - uses: github/codeql-action/upload-sarif@v4.38.0
        with:
          sarif_file: trivy.sarif
          category: trivy-pipeline
