name: Docker image

on:
  push:
    branches: [main, develop]
    paths:
      - "Dockerfile"
      - "main.py"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/fedlearnnet/tool-build-pipeline/pipeline

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    # Native runners per architecture: apt installs and freshclam under QEMU emulation are much slower.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No layer cache on purpose: every build should get current security packages and ClamAV signatures.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: vars
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "tags=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Create multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.vars.outputs.tags }}
        run: |
          tag_args=(-t "$IMAGE:${TAGS%% *}-${GITHUB_SHA::7}")
          for tag in $TAGS; do tag_args+=(-t "$IMAGE:$tag"); done
          docker buildx imagetools create \
            "${tag_args[@]}" \
            $(printf "$IMAGE@sha256:%s " *)

  # Vulnerability scan after every build (results under Security → Code scanning)
  scan:
    needs: manifest
    uses: ./.github/workflows/scan.yml
    with:
      tag: ${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
    permissions:
      contents: read
      packages: read
      security-events: write
