name: Docker image

on:
  push:
    branches: [main, develop]
    paths:
      - "Dockerfile"
      - "main.py"
      - "src/**"
      - "requirements.txt"
      - "VERSION"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/fedlearnnet/tool-build-pipeline/pipeline

jobs:
  # Version from the VERSION file and whether it gets an image tag and a release, see FedLearnNet/.github/actions/version
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_image: ${{ steps.version.outputs.tag_image }}
      release: ${{ steps.version.outputs.release }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        uses: FedLearnNet/.github/actions/version@main

  build:
    needs: version
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    # Native runners per architecture: apt installs and freshclam under QEMU emulation are much slower.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No layer cache on purpose: every build should get current security packages and ClamAV signatures.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  manifest:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: vars
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG_IMAGE: ${{ needs.version.outputs.tag_image }}
        run: |
          tags=$([ "$GITHUB_REF" = "refs/heads/main" ] && echo latest || echo staging)
          if [ "$TAG_IMAGE" = true ]; then tags="$tags $VERSION"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.vars.outputs.tags }}
        run: |
          tag_args=()
          for tag in $TAGS; do tag_args+=(-t "$IMAGE:$tag"); done
          docker buildx imagetools create \
            "${tag_args[@]}" \
            $(printf "$IMAGE@sha256:%s " *)

  # First build of a release candidate or release: git tag and GitHub release
  release:
    needs: [version, manifest]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$VERSION" --generate-notes --prerelease="$PRERELEASE"

  # Vulnerability scan after every build (results under Security → Code scanning)
  scan:
    needs: manifest
    uses: ./.github/workflows/scan.yml
    with:
      tag: ${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
    permissions:
      contents: read
      packages: read
      security-events: write
